name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签名（tag push 触发时自动为 v*；手动派发时显式给）'
        required: false

# 国内 runner 不走 marketplace（与 admin 仓 CI 同策略）：git clone 检出、
# npmmirror 装 Node/pnpm，@snap-rail scope 走本机 Gitea npm（凭据注入 ~/.npmrc）。
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # job 容器在默认桥接网络，解析不了 runner 的内网注册地址（gitea:3000），
        # 检出地址必须显式指向宿主机发布端口。
        env:
          GIT_SERVER_URL: http://192.168.1.9:3000
        run: |
          GIT_SERVER_URL="${GIT_SERVER_URL:-$GITHUB_SERVER_URL}"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            -c credential.helper='!f() { echo "username=${{ github.actor }}"; echo "password=${{ secrets.GITEA_TOKEN }}"; }; f' \
            "$GIT_SERVER_URL/$GITHUB_REPOSITORY.git" .
      - name: Node >= 24（镜像自带版本过低时从 npmmirror 二进制覆盖）
        run: |
          node -v || true
          major=$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)
          if [ "${major:-0}" -lt 23 ]; then
            ver=24.19.0
            curl -fsSL -o /tmp/node.tar.xz "https://registry.npmmirror.com/-/binary/node/v${ver}/node-v${ver}-linux-x64.tar.xz"
            if command -v sudo >/dev/null 2>&1; then S=sudo; else S=; fi
            $S rm -rf /usr/local/lib/node_modules /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx
            $S tar -xJf /tmp/node.tar.xz --strip-components=1 -C /usr/local
            hash -r
          fi
          node -v
      - name: pnpm + 源凭据（国内源；@snap-rail 走本机 Gitea）
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          npm config set registry https://registry.npmmirror.com
          npm install -g pnpm@11.22.0
          printf '//192.168.1.9:3000/api/packages/snap-rail/npm/:_authToken=%s\n' "$FEED_TOKEN" >> ~/.npmrc
          pnpm -v
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: pack (signed)
        env:
          SIGN_KEY: ${{ secrets.RELEASE_PRIVATE_PEM }}
          KEY_ID: ${{ secrets.RELEASE_KEY_ID }}
        run: |
          printf '%s' "$SIGN_KEY" | base64 -d > release.private.pem
          pnpm exec snap-rail-plugin pack . --out dist --sign-key release.private.pem --key-id "$KEY_ID" --publisher snap-rail
          rm release.private.pem
      - name: create release + upload
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
          ASSET: @snap-rail__suite-terminal-ops.zip
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          curl -sf -X POST "http://192.168.1.9:3000/api/v1/repos/snap-rail/snap-rail-suite-terminal-ops/releases" \
            -H "Authorization: token $FEED_TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG_NAME\",\"name\":\"$TAG_NAME\"}"
          id=$(curl -sf "http://192.168.1.9:3000/api/v1/repos/snap-rail/snap-rail-suite-terminal-ops/releases/tags/$TAG_NAME" -H "Authorization: token $FEED_TOKEN" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).id))')
          curl -sf -X POST "http://192.168.1.9:3000/api/v1/repos/snap-rail/snap-rail-suite-terminal-ops/releases/$id/assets?name=%40snap-rail__suite-terminal-ops.zip" \
            -H "Authorization: token $FEED_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$ASSET"
